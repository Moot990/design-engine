name: Weekly review
on:
  schedule:
    - cron: '43 7 * * 5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: design-engine-state-main
  cancel-in-progress: false
jobs:
  report:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (vars.ENGINE_ENABLED == 'true' && vars.ACTIONS_PRODUCTION_APPROVED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m engine report --output reports
      - name: Save report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports
          if ! git diff --cached --quiet; then
            git commit -m 'Update weekly content review [skip ci]'
            git push origin HEAD:main
          fi
          cat reports/weekly-latest.md >> "$GITHUB_STEP_SUMMARY"
